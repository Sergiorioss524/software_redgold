<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}RedGold{% endblock %}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #1b1b1b;
      --paper: #f6f3ec;
      --card: #fffdf9;
      --border: #e4ddc9;
      --gold: #8a6a1a;
      --gold-dark: #6b5113;
      --muted: #6f6a5f;
      --good: #1b7a3d;
      --bad: #b3261e;
    }
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 17px;
      line-height: 1.5;
      max-width: 900px;
      margin: 0 auto;
      padding: 2rem 1.5rem 4rem;
      color: var(--ink);
      background: var(--paper);
    }
    h1 {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.01em;
      margin: 0 0 1.5rem;
      color: var(--gold-dark);
    }
    h2 { font-size: 1.4rem; font-weight: 700; margin: 2.5rem 0 0.4rem; }
    table { width: 100%; border-collapse: collapse; margin: 1rem 0 1.5rem; background: var(--card); }
    th, td { text-align: left; padding: 0.65rem 0.85rem; border-bottom: 1px solid #ece5d3; font-size: 1rem; }
    th { background: #efe6cd; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--gold-dark); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      margin-bottom: 1.25rem;
      box-shadow: 0 1px 3px rgba(60, 45, 10, 0.06);
    }
    .stat { font-size: 1.9rem; font-weight: 800; line-height: 1.2; }
    .stat-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      margin-bottom: 0.35rem;
    }
    .positive { color: var(--good); }
    .negative { color: var(--bad); }
    form.inline { display: inline; }
    form.stack label { display: block; margin: 1.1rem 0 0.3rem; font-size: 0.95rem; font-weight: 700; }
    form.stack input, form.stack select {
      width: 100%;
      max-width: 360px;
      padding: 0.6rem 0.7rem;
      font-size: 1rem;
      border: 1px solid #d3c9ab;
      border-radius: 6px;
      background: #fff;
    }
    form.stack input:focus, form.stack select:focus {
      outline: none;
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(138, 106, 26, 0.15);
    }
    button {
      background: var(--gold);
      color: #fff;
      border: none;
      padding: 0.7rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 700;
    }
    button:hover { background: var(--gold-dark); }
    .flash { padding: 0.85rem 1.1rem; border-radius: 8px; margin-bottom: 1.25rem; font-size: 1rem; font-weight: 600; }
    .flash.success { background: #e3f4e9; color: var(--good); }
    .flash.error { background: #fbe9e7; color: var(--bad); }
    .muted { color: var(--muted); font-size: 0.95rem; }
    .formula { color: #9a917d; font-size: 0.82rem; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    td.formula { white-space: nowrap; }
    .stat-label .formula, .muted .formula { margin-left: 0.5rem; }
  </style>
  <script>
    var TROY_OUNCE_GRAMS = 31.1035;
    function formatNumber(n, decimals) {
      return n.toLocaleString('en-US', {minimumFractionDigits: decimals, maximumFractionDigits: decimals});
    }
    // ids: {weight, purity, buyPrice, buyRate, rateFisico, outFineWeight, outFineOz, outTotalUsd, outTotalBs}
    // buyPrice/buyRate/outTotalUsd/outTotalBs are optional -- omit them to
    // only track peso fino / onza fina. rateFisico is optional: when given,
    // "total en dólares" = total en Bolivianos / TC compra físico instead of
    // onza fina x bolsa de compra.
    function bindPurchaseCalc(ids) {
      var weightEl = document.getElementById(ids.weight);
      var purityEl = document.getElementById(ids.purity);
      var buyPriceEl = ids.buyPrice ? document.getElementById(ids.buyPrice) : null;
      var buyRateEl = ids.buyRate ? document.getElementById(ids.buyRate) : null;
      var rateFisicoEl = ids.rateFisico ? document.getElementById(ids.rateFisico) : null;
      var outFineWeightEl = document.getElementById(ids.outFineWeight);
      var outFineOzEl = ids.outFineOz ? document.getElementById(ids.outFineOz) : null;
      var outTotalUsdEl = ids.outTotalUsd ? document.getElementById(ids.outTotalUsd) : null;
      var outTotalBsEl = ids.outTotalBs ? document.getElementById(ids.outTotalBs) : null;
      if (!weightEl || !purityEl || !outFineWeightEl) return;

      function update() {
        var w = parseFloat(weightEl.value);
        var p = parseFloat(purityEl.value);
        var fineGrams = (isNaN(w) || isNaN(p)) ? null : w * p;
        var fineOz = fineGrams === null ? null : fineGrams / TROY_OUNCE_GRAMS;

        outFineWeightEl.textContent = 'Peso fino: ' + (fineGrams === null ? '—' : formatNumber(fineGrams, 4) + ' gr');
        if (outFineOzEl) {
          outFineOzEl.textContent = 'Onza fina: ' + (fineOz === null ? '—' : formatNumber(fineOz, 4) + ' oz');
        }

        if (outTotalUsdEl || outTotalBsEl) {
          var buyPrice = buyPriceEl ? parseFloat(buyPriceEl.value) : NaN;
          var buyRate = buyRateEl ? parseFloat(buyRateEl.value) : NaN;
          var baseUsd = (fineOz === null || isNaN(buyPrice)) ? null : fineOz * buyPrice;
          var totalBs = (baseUsd === null || isNaN(buyRate)) ? null : baseUsd * buyRate;

          var totalUsd = baseUsd;
          if (rateFisicoEl) {
            var rateFisico = parseFloat(rateFisicoEl.value);
            totalUsd = (totalBs === null || isNaN(rateFisico) || rateFisico === 0) ? null : totalBs / rateFisico;
          }

          if (outTotalBsEl) {
            outTotalBsEl.textContent = 'Total de compra en Bolivianos: ' + (totalBs === null ? '—' : formatNumber(totalBs, 2) + ' Bs');
          }
          if (outTotalUsdEl) {
            outTotalUsdEl.textContent = 'Total en dólares: ' + (totalUsd === null ? '—' : '$' + formatNumber(totalUsd, 2));
          }
        }
      }

      [weightEl, purityEl, buyPriceEl, buyRateEl, rateFisicoEl].forEach(function(el) {
        if (el) el.addEventListener('input', update);
      });
      update();
    }
  </script>
</head>
<body>
  <h1>RedGold</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
