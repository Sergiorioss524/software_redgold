<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>{% block title %}RedGold{% endblock %}</title>
  <style>
    :root { color-scheme: light; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 960px;
      margin: 0 auto;
      padding: 1.5rem;
      color: #1b1b1b;
      background: #f7f5f0;
    }
    h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
    h2 { font-size: 1.1rem; margin-top: 2rem; }
    nav { display: flex; gap: 1rem; margin: 1rem 0 2rem; border-bottom: 1px solid #ddd; padding-bottom: 0.75rem; }
    nav a { color: #7a5b00; text-decoration: none; font-weight: 600; }
    nav a:hover { text-decoration: underline; }
    table { width: 100%; border-collapse: collapse; margin: 0.75rem 0 1.5rem; background: #fff; }
    th, td { text-align: left; padding: 0.4rem 0.6rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    th { background: #efe9db; }
    .card { background: #fff; border: 1px solid #e3ddc9; border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1rem; }
    .stat { font-size: 1.3rem; font-weight: 700; }
    .stat-label { font-size: 0.78rem; color: #666; text-transform: uppercase; letter-spacing: 0.02em; }
    .positive { color: #1b7a3d; }
    .negative { color: #b3261e; }
    form.inline { display: inline; }
    form.stack label { display: block; margin: 0.6rem 0 0.2rem; font-size: 0.85rem; font-weight: 600; }
    form.stack input, form.stack select { width: 100%; max-width: 320px; padding: 0.4rem; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #7a5b00; color: #fff; border: none; padding: 0.5rem 1rem; border-radius: 4px; cursor: pointer; font-size: 0.9rem; }
    button:hover { background: #5f4700; }
    .flash { padding: 0.6rem 1rem; border-radius: 6px; margin-bottom: 1rem; font-size: 0.9rem; }
    .flash.success { background: #e3f4e9; color: #1b7a3d; }
    .flash.error { background: #fbe9e7; color: #b3261e; }
    .muted { color: #777; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>RedGold — Ledger</h1>
  <nav>
    <a href="{{ url_for('dashboard') }}">Dashboard</a>
    <a href="{{ url_for('list_purchases') }}">Compras</a>
    <a href="{{ url_for('new_purchase') }}">+ Compra</a>
    <a href="{{ url_for('list_sales') }}">Ventas</a>
    <a href="{{ url_for('new_sale') }}">+ Venta</a>
  </nav>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</body>
</html>
