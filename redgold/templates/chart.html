{% extends "base.html" %}
{% block title %}Oro/USD en vivo — RedGold{% endblock %}
{% block content %}

<h2 style="margin-top:0">Oro contra el dólar (XAU/USD) — en vivo</h2>
<p class="muted">Cotización en vivo de TradingView, independiente de las fuentes de precio del dashboard.</p>

<div class="card" style="padding:0.5rem">
  <div class="tradingview-widget-container" style="height:560px">
    <div id="tradingview_xauusd" style="height:100%"></div>
  </div>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
  <script type="text/javascript">
    new TradingView.widget({
      "autosize": true,
      "symbol": "OANDA:XAUUSD",
      "interval": "60",
      "timezone": "America/La_Paz",
      "theme": "light",
      "style": "1",
      "locale": "es",
      "toolbar_bg": "#f6f3ec",
      "enable_publishing": false,
      "allow_symbol_change": true,
      "container_id": "tradingview_xauusd"
    });
  </script>
</div>

{% endblock %}
