{% extends "base.html" %}
{% block title %}Nueva venta — RedGold{% endblock %}
{% block content %}
<h2>Registrar venta</h2>
<p class="muted">
  Inventario disponible:
  {% for cat in categories %}
    {{ category_labels[cat] }}: <strong>{{ "%.4f"|format(inventory[cat]) }} oz finas</strong>{{ ", " if not loop.last }}
  {% endfor %}
</p>
<form class="stack" method="post" action="{{ url_for('new_sale') }}">
  <label for="sale_date">Fecha</label>
  <input id="sale_date" name="sale_date" type="date" value="{{ today }}" required>

  <label for="category">Ciclo</label>
  <select id="category" name="category" required>
    {% for cat in categories %}
      <option value="{{ cat }}">{{ category_labels[cat] }}</option>
    {% endfor %}
  </select>

  <label for="fine_oz_sold">Onzas finas vendidas</label>
  <input id="fine_oz_sold" name="fine_oz_sold" type="number" step="0.000001" required>

  <label for="sale_price_usd_per_oz">Bolsa de venta (USD/oz)</label>
  <input id="sale_price_usd_per_oz" name="sale_price_usd_per_oz" type="number" step="0.01" required>

  <label for="royalty_pct">Regalías (0-1, ej. 0.009 = 0.9%)</label>
  <input id="royalty_pct" name="royalty_pct" type="number" step="0.0001" value="{{ default_royalty[categories[0]] }}" required>

  <label for="commission_pct">Comisión (0-1)</label>
  <input id="commission_pct" name="commission_pct" type="number" step="0.0001" value="{{ default_commission }}" required>

  <label for="exchange_rate_bs_per_usd">Tipo de cambio de la venta (Bs/$)</label>
  <input id="exchange_rate_bs_per_usd" name="exchange_rate_bs_per_usd" type="number" step="0.0001" required>

  <label for="notes">Notas</label>
  <input id="notes" name="notes" type="text">

  <button type="submit" style="margin-top:1rem">Guardar venta</button>
</form>
{% endblock %}
